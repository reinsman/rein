[package]
name = "rein"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local agent daemon and command-line client"

[[bin]]
name = "rein"
path = "src/bin/rein.rs"

[[bin]]
name = "reind"
path = "src/bin/reind.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rein-proto = { path = "../proto/gen/rust/rein-proto" }
a2alinker = { path = "../a2alinker/crates/a2alinker" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "=0.14.2", features = ["tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
