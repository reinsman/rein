[package]
name = "rein"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local agent daemon and command-line client"

[[bin]]
name = "rein"
path = "src/bin/rein.rs"

[[bin]]
name = "reind"
path = "src/bin/reind.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rein-proto = { path = "../proto/gen/rust/rein-proto" }
a2alinker = { path = "../a2alinker/crates/a2alinker" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
prost = "=0.14.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
ra2a = { version = "=0.10.1", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
